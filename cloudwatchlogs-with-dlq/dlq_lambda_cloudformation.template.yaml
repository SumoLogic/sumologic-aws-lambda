AWSTemplateFormatVersion: '2010-09-09'
Description: Sumo Logic CloudWatch log collector
Parameters:
    SumoEndPointURL:
        Type: String
        Default: <Enter URL Here>
        Description: Enter SUMO_ENDPOINT created while configuring HTTP Source
    EmailID:
        Type: String
        Default: test@gmail.com
        Description: Enter your email for receiving alerts.You will receive confirmation email after the deployment is complete, confirm it to subscribe for alerts.
    NumOfWorkers:
        Type: Number
        Default: 4
        Description: Enter the number of lambda function invocations for faster Dead Letter Queue processing.
    LogFormat:
        Type: String
        Default: Others
        AllowedValues:
            - VPC-RAW
            - VPC-JSON
            - Others
        Description: Choose the Service
    IncludeLogGroupInfo:
        Type: String
        Default: 'false'
        AllowedValues:
            - 'true'
            - 'false'
        Description: Select true to get loggroup/logstream values in logs
    LogStreamPrefix:
        Type: String
        Description: (Optional) Enter comma separated list of logStream name prefixes to filter by logStream. Please note this is seperate from a logGroup. This is used to only send certain logStreams within a cloudwatch logGroup(s). LogGroups still need to be subscribed to the created Lambda funciton, regardless of what is input for this value.
        Default: ''
Mappings:
    RegionMap:
        us-east-1:
            bucketname: appdevzipfiles-us-east-1
        us-east-2:
            bucketname: appdevzipfiles-us-east-2
        us-west-1:
            bucketname: appdevzipfiles-us-west-1
        us-west-2:
            bucketname: appdevzipfiles-us-west-2
        ap-south-1:
            bucketname: appdevzipfiles-ap-south-1
        ap-northeast-2:
            bucketname: appdevzipfiles-ap-northeast-2
        ap-southeast-1:
            bucketname: appdevzipfiles-ap-southeast-1
        ap-southeast-2:
            bucketname: appdevzipfiles-ap-southeast-2
        ap-northeast-1:
            bucketname: appdevzipfiles-ap-northeast-1
        ap-east-1:
            bucketname: appdevzipfiles-ap-east-1s
        af-south-1:
            bucketname: appdevzipfiles-af-south-1s
        ca-central-1:
            bucketname: appdevzipfiles-ca-central-1
        eu-central-1:
            bucketname: appdevzipfiles-eu-central-1
        eu-west-1:
            bucketname: appdevzipfiles-eu-west-1
        eu-west-2:
            bucketname: appdevzipfiles-eu-west-2
        eu-west-3:
            bucketname: appdevzipfiles-eu-west-3
        eu-north-1:
            bucketname: appdevzipfiles-eu-north-1s
        eu-south-1:
            bucketname: appdevzipfiles-eu-south-1
        me-south-1:
            bucketname: appdevzipfiles-me-south-1s
        sa-east-1:
            bucketname: appdevzipfiles-sa-east-1
        me-central-1:
            bucketname: appdevzipfiles-me-central-1
        eu-central-2:
            bucketname: appdevzipfiles-eu-central-2ss
        ap-northeast-3:
            bucketname: appdevzipfiles-ap-northeast-3s
        ap-southeast-3:
            bucketname: appdevzipfiles-ap-southeast-3
Resources:
    SumoCWLogGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Join
                - '-'
                - - SumoCWLogGroup
                  - !Select
                      - '2'
                      - !Split
                          - /
                          - !Ref AWS::StackId
            RetentionInDays: 7
    SumoCWLogSubsriptionFilter:
        Type: AWS::Logs::SubscriptionFilter
        Properties:
            LogGroupName: !Ref SumoCWLogGroup
            DestinationArn: !GetAtt SumoCWLogsLambda.Arn
            FilterPattern: ''
        DependsOn:
            - SumoCWLogGroup
            - SumoCWLambdaPermission
            - SumoCWLogsLambda
    SumoCWLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !GetAtt SumoCWLogsLambda.Arn
            Action: lambda:InvokeFunction
            Principal: !Join
                - .
                - - logs
                  - !Ref AWS::Region
                  - amazonaws.com
            SourceAccount: !Ref AWS::AccountId
    SumoCWDeadLetterQueue:
        Type: AWS::SQS::Queue
        Properties:
            QueueName: !Join
                - '-'
                - - SumoCWDeadLetterQueue
                  - !Select
                      - '2'
                      - !Split
                          - /
                          - !Ref AWS::StackId
    SumoCWLambdaExecutionRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Service:
                              - lambda.amazonaws.com
                      Action:
                          - sts:AssumeRole
            Path: /
            Policies:
                - PolicyName: !Join
                      - '-'
                      - - SQSCreateLogsRolePolicy
                        - !Select
                            - '2'
                            - !Split
                                - /
                                - !Ref AWS::StackId
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - sqs:DeleteMessage
                                - sqs:GetQueueUrl
                                - sqs:ListQueues
                                - sqs:ChangeMessageVisibility
                                - sqs:SendMessageBatch
                                - sqs:ReceiveMessage
                                - sqs:SendMessage
                                - sqs:GetQueueAttributes
                                - sqs:ListQueueTags
                                - sqs:ListDeadLetterSourceQueues
                                - sqs:DeleteMessageBatch
                                - sqs:PurgeQueue
                                - sqs:DeleteQueue
                                - sqs:CreateQueue
                                - sqs:ChangeMessageVisibilityBatch
                                - sqs:SetQueueAttributes
                            Resource:
                                - !GetAtt SumoCWDeadLetterQueue.Arn
                - PolicyName: !Join
                      - '-'
                      - - CloudWatchCreateLogsRolePolicy
                        - !Select
                            - '2'
                            - !Split
                                - /
                                - !Ref AWS::StackId
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - logs:CreateLogGroup
                                - logs:CreateLogStream
                                - logs:PutLogEvents
                                - logs:DescribeLogStreams
                            Resource:
                                - !Join
                                    - ':'
                                    - - arn
                                      - !Ref AWS::Partition
                                      - logs
                                      - !Ref AWS::Region
                                      - !Ref AWS::AccountId
                                      - log-group
                                      - '*'
                - PolicyName: InvokeLambdaRolePolicy
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - lambda:InvokeFunction
                            Resource:
                                - !Join
                                    - ':'
                                    - - arn
                                      - !Ref AWS::Partition
                                      - lambda
                                      - !Ref AWS::Region
                                      - !Ref AWS::AccountId
                                      - function
                                      - !Join
                                          - '-'
                                          - - SumoCWProcessDLQLambda
                                            - !Select
                                                - '2'
                                                - !Split
                                                    - /
                                                    - !Ref AWS::StackId
    SumoCWLogsLambda:
        Type: AWS::Lambda::Function
        DependsOn:
            - SumoCWLambdaExecutionRole
            - SumoCWDeadLetterQueue
        Properties:
            FunctionName: !Join
                - '-'
                - - SumoCWLogsLambda
                  - !Select
                      - '2'
                      - !Split
                          - /
                          - !Ref AWS::StackId
            Code:
                S3Bucket: !FindInMap
                    - RegionMap
                    - !Ref AWS::Region
                    - bucketname
                S3Key: sumologic-aws-observability/functions/cloudwatch-logs-dlq/v1.4.0/cloudwatchlogs-with-dlq.zip
            Role: !GetAtt SumoCWLambdaExecutionRole.Arn
            Timeout: 300
            DeadLetterConfig:
                TargetArn: !GetAtt SumoCWDeadLetterQueue.Arn
            Handler: cloudwatchlogs_lambda.handler
            Runtime: nodejs22.x
            MemorySize: 128
            Environment:
                Variables:
                    SUMO_ENDPOINT: !Ref SumoEndPointURL
                    LOG_FORMAT: !Ref LogFormat
                    INCLUDE_LOG_INFO: !Ref IncludeLogGroupInfo
                    LOG_STREAM_PREFIX: !Ref LogStreamPrefix
    SumoCWEventsInvokeLambdaPermission:
        Type: AWS::Lambda::Permission
        Properties:
            FunctionName: !Ref SumoCWProcessDLQLambda
            Action: lambda:InvokeFunction
            Principal: events.amazonaws.com
            SourceArn: !GetAtt SumoCWProcessDLQScheduleRule.Arn
    SumoCWProcessDLQScheduleRule:
        Type: AWS::Events::Rule
        Properties:
            Description: Events rule for Cron
            ScheduleExpression: rate(5 minutes)
            State: ENABLED
            Targets:
                - Arn: !GetAtt SumoCWProcessDLQLambda.Arn
                  Id: TargetFunctionV1
    SumoCWProcessDLQLambda:
        Type: AWS::Lambda::Function
        DependsOn:
            - SumoCWLambdaExecutionRole
            - SumoCWDeadLetterQueue
        Properties:
            FunctionName: !Join
                - '-'
                - - SumoCWProcessDLQLambda
                  - !Select
                      - '2'
                      - !Split
                          - /
                          - !Ref AWS::StackId
            Code:
                S3Bucket: !FindInMap
                    - RegionMap
                    - !Ref AWS::Region
                    - bucketname
                S3Key: sumologic-aws-observability/functions/cloudwatch-logs-dlq/v1.4.0/cloudwatchlogs-with-dlq.zip
            Role: !GetAtt SumoCWLambdaExecutionRole.Arn
            Timeout: 300
            Handler: DLQProcessor.handler
            DeadLetterConfig:
                TargetArn: !GetAtt SumoCWDeadLetterQueue.Arn
            Runtime: nodejs22.x
            MemorySize: 128
            Environment:
                Variables:
                    SUMO_ENDPOINT: !Ref SumoEndPointURL
                    TASK_QUEUE_URL: !Join
                        - ''
                        - - https://sqs.
                          - !Ref AWS::Region
                          - .amazonaws.com/
                          - !Ref AWS::AccountId
                          - /
                          - !GetAtt SumoCWDeadLetterQueue.QueueName
                    NUM_OF_WORKERS: !Ref NumOfWorkers
                    LOG_FORMAT: !Ref LogFormat
                    INCLUDE_LOG_INFO: !Ref IncludeLogGroupInfo
                    LOG_STREAM_PREFIX: !Ref LogStreamPrefix
    SumoCWEmailSNSTopic:
        Type: AWS::SNS::Topic
        Properties:
            Subscription:
                - Endpoint: !Ref EmailID
                  Protocol: email
    SumoCWSpilloverAlarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            AlarmActions:
                - !Ref SumoCWEmailSNSTopic
            AlarmDescription: Notify via email if number of messages in DeadLetterQueue exceeds threshold
            ComparisonOperator: GreaterThanThreshold
            Dimensions:
                - Name: QueueName
                  Value: !GetAtt SumoCWDeadLetterQueue.QueueName
            EvaluationPeriods: '1'
            MetricName: ApproximateNumberOfMessagesVisible
            Namespace: AWS/SQS
            Period: '3600'
            Statistic: Sum
            Threshold: '100000'
        DependsOn:
            - SumoCWEmailSNSTopic
Outputs:
    SumoCWLogsLambdaArn:
        Description: The ARN of the sumologic cloudwatch logs lambda
        Value: !GetAtt SumoCWLogsLambda.Arn
        Export:
            Name: !Join
                - '-'
                - - SumoCWLogsLambdaArn
                  - !Select
                      - '2'
                      - !Split
                          - /
                          - !Ref AWS::StackId
